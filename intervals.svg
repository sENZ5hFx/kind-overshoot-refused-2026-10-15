<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <rect width="920" height="420" fill="#f7f4ee"/>
  <text x="32" y="36" font-family="Georgia, serif" font-size="20" fill="#1c1915">Kind-Overshoot not minted — Table 5 does not close</text>
  <text x="32" y="58" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#5c564c">Doney et al. 2024, GBC, doi:10.1029/2024GB008156. Printed cells. Not a new flux.</text>
  <line x1="70" y1="300" x2="880" y2="300" stroke="#1c1915" stroke-width="1"/>
  <text x="70" y="322" font-size="11" fill="#5c564c" font-family="ui-sans-serif, sans-serif">0</text>
  <text x="430" y="322" font-size="11" fill="#5c564c" font-family="ui-sans-serif, sans-serif">1.7 residual</text>
  <line x1="214" y1="80" x2="214" y2="300" stroke="#9a3412" stroke-dasharray="3 3"/>
  <text x="218" y="96" font-size="11" fill="#9a3412" font-family="ui-sans-serif, sans-serif">1.7 GtC</text>
  <!-- scale: 0 to 8 PgC maps to x 70..880, so 101.25 px per PgC -->
  <!-- F1000 printed -->
  <circle cx="136.8" cy="150" r="6" fill="#1d4e89"/>
  <text x="146" y="154" font-size="12" font-family="ui-sans-serif, sans-serif" fill="#1d4e89">Henson F1000 0.66</text>
  <circle cx="181.4" cy="180" r="6" fill="#1d4e89"/>
  <text x="190" y="184" font-size="12" font-family="ui-sans-serif, sans-serif" fill="#1d4e89">DeVries F1000 1.1</text>
  <circle cx="181.4" cy="210" r="6" fill="#1d4e89"/>
  <text x="190" y="214" font-size="12" font-family="ui-sans-serif, sans-serif" fill="#1d4e89">Nowicki F1000 1.1</text>
  <!-- products -->
  <circle cx="146.9" cy="150" r="4" fill="none" stroke="#9a3412" stroke-width="1.5"/>
  <text x="400" y="150" font-size="12" font-family="ui-sans-serif, sans-serif" fill="#9a3412">Henson 4 × 0.19 = 0.76, gap +0.10</text>
  <circle cx="166.1" cy="180" r="4" fill="none" stroke="#9a3412" stroke-width="1.5"/>
  <text x="400" y="184" font-size="12" font-family="ui-sans-serif, sans-serif" fill="#9a3412">DeVries 7.3 × 0.13 = 0.949, gap −0.151</text>
  <circle cx="167.2" cy="210" r="4" fill="none" stroke="#9a3412" stroke-width="1.5"/>
  <text x="400" y="214" font-size="12" font-family="ui-sans-serif, sans-serif" fill="#9a3412">Nowicki 6.4 × 0.15 = 0.96, gap −0.14</text>
  <text x="70" y="360" font-size="13" font-family="ui-sans-serif, sans-serif" fill="#1c1915">Open circles are export × printed transfer. Filled circles are the printed 1,000 m flux.</text>
  <text x="70" y="382" font-size="13" font-family="ui-sans-serif, sans-serif" fill="#1c1915">The gaps exceed 0.02 PgC. The axis does not close. Score 0. A column glance is not a discovery.</text>
</svg>
